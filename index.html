<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foogle</title>
    <style>
      :root {
        --bg: #fff;
        --text: #202124;
        --muted: #5f6368;
        --border: #dfe1e5;
        --button: #f8f9fa;
        --button-hover: #f1f3f4;
        --shadow: rgba(32, 33, 36, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        height: 100%;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      body {
        display: flex;
        flex-direction: column;
      }

      .topbar {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 1rem;
        padding: 1rem 1.25rem 0;
        font-size: 13px;
      }

      .topbar a,
      .topbar button {
        color: var(--text);
        text-decoration: none;
      }

      .topbar button {
        border: none;
        background: #1a73e8;
        color: white;
        padding: 0.7rem 1.2rem;
        border-radius: 999px;
        font-weight: 600;
        cursor: pointer;
      }

      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem 6rem;
      }

      .logo {
        font-size: clamp(4rem, 12vw, 8rem);
        font-weight: 700;
        letter-spacing: -0.12em;
        line-height: 1;
        margin-bottom: 1.6rem;
      }

      .logo .f { color: #4285f4; }
      .logo .o { color: #ea4335; }
      .logo .o2 { color: #fbbc05; }
      .logo .g { color: #4285f4; }
      .logo .l { color: #34a853; }
      .logo .e { color: #ea4335; }

      .search-wrap {
        width: min(90vw, 580px);
      }

      .search-bar {
        display: flex;
        align-items: center;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.8rem 1rem;
        box-shadow: 0 1px 6px rgba(32, 33, 36, .08);
        transition: box-shadow 0.2s ease, border-color 0.2s ease;
      }

      .search-bar:focus-within {
        box-shadow: 0 1px 8px rgba(32, 33, 36, .18);
        border-color: #dfe1e5;
      }

      .search-icon {
        width: 20px;
        height: 20px;
        margin-right: 0.8rem;
        color: var(--muted);
      }

      .search-bar input {
        flex: 1;
        border: none;
        outline: none;
        font-size: 1rem;
        background: transparent;
        color: var(--text);
      }

      .tools {
        display: flex;
        justify-content: center;
        gap: 0.7rem;
        margin-top: 1.8rem;
        flex-wrap: wrap;
      }

      .tools button {
        border: 1px solid transparent;
        background: var(--button);
        color: var(--text);
        border-radius: 4px;
        padding: 0.7rem 1.1rem;
        font-size: 14px;
        cursor: pointer;
      }

      .tools button:hover {
        border-color: var(--border);
        background: var(--button-hover);
        box-shadow: 0 1px 1px var(--shadow);
      }

      .footer {
        background: #f2f2f2;
        color: var(--muted);
        border-top: 1px solid #e4e4e4;
        font-size: 14px;
      }

      .footer .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.9rem 1.5rem;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .footer .links {
        display: flex;
        gap: 1.5rem;
        flex-wrap: wrap;
      }

      .footer a {
        text-decoration: none;
        color: var(--muted);
      }

      @media (max-width: 560px) {
        .topbar {
          gap: 0.6rem;
          font-size: 12px;
          padding-right: 0.75rem;
        }

        .footer .row {
          justify-content: center;
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar" aria-label="site navigation">
      <a href="#">Gmail</a>
      <a href="#">Images</a>
      <button type="button">Sign in</button>
    </header>

    <main class="main">
      <div class="logo" aria-label="Foogle logo">
        <span class="f">F</span><span class="o">o</span><span class="o2">o</span><span class="g">g</span><span class="l">l</span><span class="e">e</span>
      </div>

      <div class="search-wrap">
        <div class="search-bar" role="search">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16a6.471 6.471 0 0 0 4.23-1.57l.27.28v.79L20 21.5 21.5 20l-6-6zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <input type="text" aria-label="Search" />
        </div>

        <div class="tools">
          <button type="button">Foogle Search</button>
          <button type="button">I'm Feeling Lucky</button>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="row">
        <div class="links">
          <a href="#">About</a>
          <a href="#">Advertising</a>
          <a href="#">Business</a>
          <a href="#">How Search works</a>
        </div>
        <div class="links">
          <a href="#">Privacy</a>
          <a href="#">Terms</a>
          <a href="#">Settings</a>
        </div>
      </div>
    </footer>
  </body>
</html>
